<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sutra — Admin</title>

  <style>*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{color:#fff;background:#080808;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,Helvetica,sans-serif;display:flex}.login{width:min(420px,100% - 40px)}.brand{letter-spacing:-1px;margin-bottom:40px;font-size:28px}.brand span{color:#666;letter-spacing:0;margin-left:8px;font-size:13px}h1{letter-spacing:-1.5px;margin:0 0 8px;font-size:32px;line-height:1.1}.subtitle{color:#777;margin:0 0 30px;font-size:14px}.field{margin-bottom:20px}label{color:#aaa;margin-bottom:8px;font-size:13px;display:block}input{color:#fff;background:#111;border:1px solid #252525;border-radius:8px;outline:none;width:100%;height:52px;padding:0 16px;font-size:15px;transition:border-color .2s}input:focus{border-color:#555}button{color:#000;cursor:pointer;background:#fff;border:0;border-radius:8px;width:100%;height:52px;font-size:14px;font-weight:600;transition:opacity .2s,transform .2s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.error{color:#ff8d8d;background:#211010;border:1px solid #3b1b1b;border-radius:7px;margin-top:18px;padding:12px 14px;font-size:13px;line-height:1.4;display:none}</style>
  <script type="module" crossorigin src="/sutra/assets/admin-IDnnckxn.js"></script>
  <link rel="modulepreload" crossorigin href="/sutra/assets/supabase-C1pZBt_5.js">
  <link rel="modulepreload" crossorigin href="/sutra/assets/auth-xPYlYn5e.js">
</head>

<body>

  <main class="login">

    <div class="brand">
      Sutra <span>Admin</span>
    </div>

    <h1>Welcome back.</h1>

    <p class="subtitle">
      Sign in to manage your website.
    </p>

    <form id="login-form">

      <div class="field">
        <label for="email">Email</label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button
        id="login-button"
        type="submit"
      >
        Sign in
      </button>

      <div
        id="login-error"
        class="error"
        role="alert"
      ></div>

    </form>

  </main>


</body>
</html>
