<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sutra — Reset Password</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login { width: min(420px, calc(100% - 40px)); }
    .brand { margin-bottom: 40px; font-size: 28px; letter-spacing: -1px; }
    .brand span { margin-left: 8px; color: #666; font-size: 13px; letter-spacing: 0; }
    h1 { margin: 0 0 8px; font-size: 32px; line-height: 1.1; letter-spacing: -1.5px; }
    .subtitle { margin: 0 0 30px; color: #777; font-size: 14px; line-height: 1.5; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; }
    input {
      width: 100%; height: 52px; padding: 0 16px; border: 1px solid #252525;
      border-radius: 8px; outline: none; background: #111; color: #fff; font-size: 15px;
      transition: border-color .2s ease;
    }
    input:focus { border-color: #555; }
    button {
      width: 100%; height: 52px; border: 0; border-radius: 8px;
      background: #fff; color: #000; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .2s ease, transform .2s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .message {
      display: none; margin-top: 18px; padding: 12px 14px; border: 1px solid #3b1b1b;
      border-radius: 7px; background: #211010; color: #ff8d8d; font-size: 13px; line-height: 1.4;
    }
    .back { display: block; margin: 16px auto 0; width: auto; height: auto; padding: 0; border-radius: 0; background: transparent; color: #777; font-size: 12px; font-weight: 400; }
    .back:hover { color: #fff; transform: none; }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand">Sutra <span>Admin</span></div>
    <h1>Choose a new password.</h1>
    <p class="subtitle">Set a new password for your admin account.</p>

    <form id="reset-form">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <button id="reset-button" type="submit">Update password</button>
      <div id="reset-message" class="message" role="alert"></div>
    </form>

    <button id="back-to-login" class="back" type="button">Back to sign in</button>
  </main>

  <script type="module">
    import { supabase } from '../js/lib/supabase.js'
    import { updateAdminPassword } from '../js/admin/auth.js'

    const form = document.getElementById('reset-form')
    const button = document.getElementById('reset-button')
    const message = document.getElementById('reset-message')
    const back = document.getElementById('back-to-login')

    const show = (text, success = false) => {
      message.textContent = text
      message.style.display = 'block'
      message.style.borderColor = success ? '#263d2d' : '#3b1b1b'
      message.style.background = success ? '#0e1a12' : '#211010'
      message.style.color = success ? '#a7d7b4' : '#ff8d8d'
    }

    back.addEventListener('click', () => {
      window.location.href = './index.html'
    })

    if (!supabase) {
      show('Supabase is not configured.')
      button.disabled = true
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      message.style.display = 'none'

      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm-password').value

      if (password.length < 8) {
        show('Use a password with at least 8 characters.')
        return
      }
      if (password !== confirm) {
        show('The passwords do not match.')
        return
      }

      button.disabled = true
      button.textContent = 'Updating…'

      try {
        await updateAdminPassword(password)
        show('Password updated. You can now sign in with your new password.', true)
        form.reset()
        setTimeout(() => { window.location.href = './index.html' }, 1400)
      } catch (error) {
        console.error('Password update error:', error)
        show(error.message || 'This reset link may be expired or invalid. Request a new one from the login page.')
        button.disabled = false
        button.textContent = 'Update password'
      }
    })
  </script>
</body>
</html>
